<svg width="449" height="79" viewBox="0 0 449 79" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052CC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0080FF;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0052CC;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Passcend Text - Monospace Font -->
  <text x="20" y="52" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-size="38" font-weight="600" fill="#000000" letter-spacing="1">Passcend</text>

  <!-- Icon Background Circle with Gradient -->
  <circle cx="405" cy="39.5" r="30" fill="url(#iconGradient)"/>

  <!-- Shield Shape -->
  <g transform="translate(405, 39.5)">
    <path d="M 0 -18 L 12 -12 L 12 2 Q 12 10 0 16 Q -12 10 -12 2 L -12 -12 Z" fill="url(#shieldGradient)" opacity="0.3"/>

    <!-- Lock Shackle - More refined -->
    <path d="M -7 0 L -7 -6 A 7 7 0 0 1 7 -6 L 7 0"
          stroke="white"
          stroke-width="2.8"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Lock Body - More detailed -->
    <rect x="-9" y="0" width="18" height="13" rx="2.5" fill="white"/>

    <!-- Lock Body Inner Shadow -->
    <rect x="-8" y="1" width="16" height="11" rx="2" fill="rgba(0,100,255,0.05)"/>

    <!-- Keyhole - More sophisticated -->
    <g>
      <circle cx="0" cy="5" r="2.5" fill="url(#iconGradient)"/>
      <rect x="-1" y="6" width="2" height="4" rx="1" fill="url(#iconGradient)"/>
    </g>

    <!-- Highlight -->
    <circle cx="-4" cy="4" r="1.5" fill="rgba(255,255,255,0.4)"/>
  </g>
</svg>
